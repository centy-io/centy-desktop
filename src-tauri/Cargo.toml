[package]
name = "centy-desktop"
version = "0.1.3"
description = "Centy Desktop - Local-first issue and documentation tracker"
authors = ["Centy"]
edition = "2021"

[lib]
name = "centy_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints.clippy]
uninlined_format_args = "warn"
# Warn when a function/closure's last statement has a trailing expression
# (no semicolon) but the value is discarded rather than returned, e.g. a
# `()`-returning call as the last line of `fn main()`. This is inconsistent
# with the rest of the function body and easy to misread as an intentional
# tail-return. Caught here in build.rs's `tauri_build::build()` call.
semicolon_if_nothing_returned = "warn"
